server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    # Enlaces cortos para piezas impresas. El QR de un sticker lleva /s y nada
    # mas: las UTM se ponen aqui, no en el codigo impreso. Asi la campana se
    # puede renombrar o el destino cambiar SIN reimprimir los stickers.
    # A 2x2 cm la URL completa con UTM no cabe: serian 53 modulos, 0.33 mm por
    # modulo, por debajo de lo que un telefono lee con fiabilidad. Con /s son
    # 29 modulos y 0.54 mm. Ver docs/analitica.md.
    # 302 a proposito, no 301: un 301 lo cachea el navegador para siempre y
    # dejaria de poderse cambiar el destino.
    location = /s {
        return 302 "/?utm_source=sticker&utm_medium=qr&utm_campaign=primeros-stickers";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache sitemap and robots
    location = /sitemap.xml {
        try_files /sitemap-index.xml =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location ~* ^/sitemap.*\.xml$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }
}
