services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - sqlite_data:/data
    environment:
      - APP_ENV=production
      # Sin default a proposito: el backend falla al arrancar si no se define.
      - APP_SECRET_KEY=${APP_SECRET_KEY:?definir APP_SECRET_KEY en .env}
      - DATABASE_PATH=/data/barqueue.db
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_SONGS_PER_WINDOW=${MAX_SONGS_PER_WINDOW:-5}
      - WINDOW_MINUTES=${WINDOW_MINUTES:-30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      # Cada exec arranca un CPython nuevo (~10MB leídos de disco). A 60s eso son
      # ~320GB de lectura en 3 semanas. 300s basta: nada depende de service_healthy.
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
