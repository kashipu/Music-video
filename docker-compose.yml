services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - sqlite_data:/data
    environment:
      - APP_ENV=production
      # Sin default a proposito: el backend falla al arrancar si no se define.
      - APP_SECRET_KEY=${APP_SECRET_KEY:?definir APP_SECRET_KEY en .env}
      - DATABASE_PATH=/data/barqueue.db
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Sin BREVO_API_KEY no se envia correo: el link de verificacion se loguea
      # y la cuenta igual sirve (el login no exige email_verified).
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@repitela.com}
      # Base de los links de verificacion/reset. Sin esto apuntan a localhost.
      - FRONTEND_URL=${FRONTEND_URL:-https://app.repitela.com}
      # Sin secret, valid_turnstile() acepta todo: el registro queda sin anti-bot.
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Hostnames que Cloudflare puede reportar en siteverify. Nunca localhost en prod.
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-app.repitela.com}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Llaves de Wompi (sandbox pub_test_* o produccion pub_prod_*). Sin ellas
      # el checkout responde 503 y el webhook no procesa eventos.
      - WOMPI_PUBLIC_KEY=${WOMPI_PUBLIC_KEY:-}
      - WOMPI_INTEGRITY_SECRET=${WOMPI_INTEGRITY_SECRET:-}
      - WOMPI_EVENTS_SECRET=${WOMPI_EVENTS_SECRET:-}
      - MAX_SONGS_PER_WINDOW=${MAX_SONGS_PER_WINDOW:-5}
      - WINDOW_MINUTES=${WINDOW_MINUTES:-30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      # Cada exec arranca un CPython nuevo (~10MB leídos de disco). A 60s eso son
      # ~320GB de lectura en 3 semanas. 300s basta: nada depende de service_healthy.
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Sitekey publica del widget de Turnstile (no es secreto).
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-0x4AAAAAAEZ0hYgY2o1yd8oe}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
