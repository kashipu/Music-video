server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nginx corre detras de Traefik, que termina el TLS. Sin esto reconstruye el
    # Location en http:// y cada escaneo de QR paga un salto extra para volver a https.
    absolute_redirect off;

    # QR de la app. Una letra por superficie: /a lo imprime el panel admin, /v esta
    # en la pantalla de video. Igual que el /s de la landing. La UTM va aqui, no en
    # el codigo impreso: asi el QR no gana modulos y la marcacion se puede cambiar
    # sin reimprimir. Ver docs/analitica.md.
    # 302 y no 301: el 301 se cachea para siempre y el destino deja de poder cambiarse.
    location ~ "^/([A-Za-z0-9_-]+)/a$" {
        return 302 "/$1/registro?utm_source=mesa&utm_medium=qr";
    }

    location ~ "^/([A-Za-z0-9_-]+)/v$" {
        return 302 "/$1/registro?utm_source=pantalla&utm_medium=qr";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html apunta a los JS/CSS hasheados de ESTE build. Si el navegador
        # lo cachea, tras un deploy pide assets que ya no existen. Los assets si
        # se cachean 30d (regla de abajo): el hash cambia en cada build.
        add_header Cache-Control "no-cache";
    }

    # API and uploads — always proxy to backend (must be before static assets rule)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # El SW debe revalidarse siempre — cachearlo rompe las actualizaciones de la PWA.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Cache static frontend assets (exclude /api/ paths handled above)
    location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
